    <clipPath id="front"><rect x="0" y="16.4" width="32" height="16"/></clipPath>
    <linearGradient id="globe" x1="0.25" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7ad6e0"/>
      <stop offset="0.55" stop-color="#3d8ba1"/>
